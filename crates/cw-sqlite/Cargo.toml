[package]
name = "cw-sqlite"
version.workspace = true
description = "One private SQLite database for a CLI: a writer or a reader per call, fixed pragmas, one write transaction, append-only migrations."
readme = "README.md"
keywords = ["sqlite", "migrations", "wal", "cli"]
categories = ["database"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# A temporary root with a database in it, and staging a database at an older
# schema version, for a project's own tests.
test-support = ["dep:tempfile"]

# cw-sqlite depends on cw-base and cw-fs only (scripts/check-dependency-direction.sh).
[dependencies]
cw-base.workspace = true
cw-fs.workspace = true
rusqlite.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
