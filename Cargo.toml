[workspace]
resolver = "3"
# One directory per published crate. A new member needs a row in README.md
# and its own README, docs and example; see AGENTS.md.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/constellation-works/satellites"

[workspace.dependencies]
# Kit crates, by path for the workspace and by version for publishing.
cw-base = { path = "crates/cw-base", version = "0.1.0" }
cw-fs = { path = "crates/cw-fs", version = "0.1.0" }
cw-supervise = { path = "crates/cw-supervise", version = "0.1.0" }
cw-sqlite = { path = "crates/cw-sqlite", version = "0.1.0" }
cw-app = { path = "crates/cw-app", version = "0.1.0" }
cw-cli = { path = "crates/cw-cli", version = "0.1.0" }

# cw-cli builds clap without `color` and `wrap_help`: both make clap ask the
# terminal on its own, and cw-cli makes that decision once (STD-01 R17).
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
# cw-sqlite builds its own SQLite and re-exports rusqlite, so a project names one version.
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.25"
thiserror = "2.0.18"
time = { version = "0.3.47", default-features = false, features = ["std", "formatting", "parsing"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["std", "fmt", "env-filter"] }
unicode-width = { version = "0.2.2", default-features = false }

# STD-02 lint baseline, verbatim from the standard. Do not trim it; add to it.
# Workspace-wide lint config. Each crate opts in via `[lints] workspace = true`.
# Keep this list short — only rules that are mechanically true everywhere.
[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

# Adoptable additions beyond the baseline (STD-02 "Adoptable additions").
# STD-02 R27: no wildcard arm on an enum match; a foreign enum that needs one
# gets a scoped #[allow] with its reason.
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# STD-02 R28: narrowing `as` casts must be checked conversions.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

[workspace.lints.rust]
# Published crates: every public item is documented.
missing_docs = "deny"
