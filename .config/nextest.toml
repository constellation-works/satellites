# nextest configuration (STD-03 R22: every test has a wall-clock bound).

[profile.default]
# A test still running after 60 s is reported slow, and killed at 120 s.
slow-timeout = { period = "60s", terminate-after = 2 }

# The lock tests measure wall-clock time. Each runs alone, so a busy shared
# runner cannot stretch one test's waits with another's work, and each has a
# tighter deadline of its own.
[[profile.default.overrides]]
filter = "package(cw-fs) & binary(lock)"
threads-required = "num-test-threads"
slow-timeout = { period = "15s", terminate-after = 2 }

# The cw-supervise run tests measure wall-clock time (a grace, a drain wait).
# Each runs alone, with a tighter deadline of its own.
[[profile.default.overrides]]
filter = "package(cw-supervise) & (binary(group) | binary(output))"
threads-required = "num-test-threads"
slow-timeout = { period = "15s", terminate-after = 2 }

# cw-sqlite's transaction tests measure a lock wait; the same rule.
[[profile.default.overrides]]
filter = "package(cw-sqlite) & binary(transaction)"
threads-required = "num-test-threads"
slow-timeout = { period = "15s", terminate-after = 2 }

# The audit test that waits on a held lock measures wall-clock time too.
[[profile.default.overrides]]
filter = "package(cw-app) & binary(busy)"
threads-required = "num-test-threads"
slow-timeout = { period = "15s", terminate-after = 2 }

# cw-mcp's shutdown test holds a bounded shutdown to a wall-clock deadline;
# the same rule.
[[profile.default.overrides]]
filter = "package(cw-mcp) & binary(shutdown)"
threads-required = "num-test-threads"
slow-timeout = { period = "30s", terminate-after = 2 }
